name = "test-mail"
main = "src/index.js"
compatibility_date = "2026-08-07"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

[[d1_databases]]
binding = "db"			# The D1 binding name must not be changed.
database_name = "test-email"		# D1 database name.
database_id = "00000000-0000-0000-0000-000000000000"		#local test placeholder

[[kv_namespaces]]
binding = "kv"			# The KV binding name must not be changed.
id = "00000000000000000000000000000000"					#local test placeholder

# Optional
#[[r2_buckets]]
#binding = "r2"			# The R2 object-storage binding name must not be changed.
#bucket_name = "test-email"		# R2 bucket name.

[[ratelimits]]
name = "AUTH_RATE_LIMITER"
namespace_id = "1001"

[ratelimits.simple]
limit = 10
period = 60

[assets]
binding = "assets"		# The static-assets binding name must not be changed.
directory = "./dist"	# Vue frontend build output; defaults to dist.
not_found_handling = "single-page-application"
run_worker_first = true

[triggers]
crons = ["0 16 * * *"]	# Run the daily task at midnight UTC+8 to refresh analytics caches.


[vars]
ai_model = ""			# Defaults to @cf/meta/llama-3.1-8b-instruct when omitted.
analysis_cache = false			# Enable analytics-data caching.
orm_log = false			# Enable SQL logging.
domain = ["example.com"]				# Supports multiple domains, for example: ["example1.com", "example2.com"].
admin = "admin@example.com"				# Administrator email, for example: admin@example.com.
jwt_secret = "test-only-jwt-secret-not-for-deployment"
init_secret = "test-only-init-secret-not-for-deployment"

[build]
command = "pnpm --prefix ../mail-vue install --frozen-lockfile && pnpm --prefix ../mail-vue run build"
